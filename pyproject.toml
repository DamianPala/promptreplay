[project]
name = "promptreplay"
version = "0.2.0"
description = "Record real agent-harness API traffic, replay it byte-for-byte against LLM providers, compare cache behaviour and cost"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Damian Pala" }]
keywords = [
    "llm",
    "prompt-caching",
    "benchmark",
    "openrouter",
    "anthropic",
    "claude-code",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "click>=8.5",
    "rich>=14",
    "httpx>=0.28",
    "pydantic>=2.9",
    "starlette>=0.45",
    "uvicorn>=0.34",
]

[project.scripts]
promptreplay = "promptreplay.app:run"

[project.urls]
Homepage = "https://github.com/DamianPala/promptreplay"
Repository = "https://github.com/DamianPala/promptreplay"
Changelog = "https://github.com/DamianPala/promptreplay/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pyright>=1.1",
    "pytest>=8",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# TC004: a name imported only under `TYPE_CHECKING` but used in an annotation that is
# evaluated at runtime. Modules that keep `bench.*` off the import path quote such
# annotations by hand, and nothing else catches an unquoted one before it reaches a user.
select = ["E", "F", "I", "W", "N", "UP", "B", "C4", "SIM", "RUF", "C90", "PLR0913", "PLR0917", "TC004"]
# N818: exception classes are named after their F3 `kind` (`Timeout`, `Interrupted`, ...);
# an `Error` suffix would collide with the builtins `TimeoutError` and `InterruptedError`.
ignore = ["N818"]
mccabe.max-complexity = 8
pylint.max-args = 8
pylint.max-positional-args = 5

[tool.ruff.lint.isort]
force-single-line = false
known-first-party = ["promptreplay"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -q"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.uv]
# Pinned so `uv lock` resolves the same set everywhere; a user-level `exclude-newer`
# alone is not recorded consistently and made CI's `uv sync --locked` re-resolve.
exclude-newer = "2026-09-21T00:00:00Z"
