name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      - name: Test
        run: uv run pytest -q
        env:
          TERM: xterm

  build:
    name: Build and smoke-test the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build
        run: uv build

      - name: Check the wheel carries the packaged data
        run: unzip -l dist/*.whl | grep -E "provibench/data/(sample|targets)"

      - name: Smoke-test the wheel in a clean environment
        run: |
          uv run --isolated --no-project --python 3.12 --with dist/*.whl \
            provibench --help
          uv run --isolated --no-project --python 3.12 --with dist/*.whl \
            provibench schema > /dev/null
          uv run --isolated --no-project --python 3.12 --with dist/*.whl \
            provibench inspect sample > /dev/null
